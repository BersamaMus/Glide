name: native_imaging
description: "Windows help for Glide: the Recycle Bin, and decoding HEIC, AVIF, TIFF and RAW with Windows Imaging Component."
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.13.5
  flutter: '>=3.3.0'

dependencies:
  ffi: ^2.1.3
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      windows:
        ffiPlugin: true
