name: glide
description: "Glide: every picture on your PC, drives and phone, newest first by month."
publish_to: 'none'

# name+build number: versionName and versionCode on Android. Raise both for
# every release (Android won't install a build whose number isn't higher).
version: 1.1.0+3

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  package_info_plus: ^10.2.2
  # Windows' own picture decoding, file operations, phones and background
  # removal; see packages/native_imaging.
  native_imaging:
    path: packages/native_imaging
  file_selector: ^1.1.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # The editor's adjustments and filters, previewed.
  shaders:
    - shaders/look.frag
